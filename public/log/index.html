<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="宮下 晃の活動ログ。勉強したこと、作ったもの、読んだ本、日々の記録。">

</script>

</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">Hikaru Miyashita</a>
  <nav>
    <a href="/">経歴</a>
    <a href="/log/" aria-current="page">ログ</a>
    <a href="/log/write" title="本人用">✎</a>
  </nav>
  <button class="btn-ghost" id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
</div></header>

<main class="wrap">
  <div class="hero">
    <div class="kicker">Activity log</div>
    <h1>ログ</h1>
    <p class="lead">勉強したこと、作ったもの、読んだ本、日々の記録。</p>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><b id="sMonth">–</b><span>今月の記録</span></div>
    <div class="stat"><b id="sHours">–</b><span>今月の勉強・開発・読書</span></div>
    <div class="stat"><b id="sStreak">–</b><span>連続記録日数</span></div>
    <div class="stat"><b id="sTotal">–</b><span>累計</span></div>
  </div>

  <div class="filters" id="filters">
    <button class="on" data-cat="">すべて</button>
    <input id="q" type="search" placeholder="検索">
  </div>

  <div id="list"><p class="empty">読み込み中…</p></div>
</main>
<footer>© <span id="yr"></span> Hikaru Miyashita · <a href="/">職務経歴へ</a></footer>

<script type="module">
import { collection, getDocs, limit, orderBy, query, where } from 'https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js'
import { CATS, db, esc, fmtMonth, monthKey, renderEntry, toEntry, todayStr } from '/log/fb.js'

document.getElementById('yr').textContent = new Date().getFullYear()
document.getElementById('themeBtn').onclick = () => {
  const d = document.documentElement
  const cur = d.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  const t = cur === 'dark' ? 'light' : 'dark'
  d.setAttribute('data-theme', t)
  try { localStorage.setItem('theme', t) } catch {}
}

const filters = document.getElementById('filters')
const q = document.getElementById('q')
for (const [key, c] of Object.entries(CATS)) {
  const b = document.createElement('button')
  b.dataset.cat = key
  b.textContent = c.label
  filters.insertBefore(b, q)
}

let all = []
let cat = ''
const list = document.getElementById('list')

function render() {
  const kw = q.value.trim().toLowerCase()
  const rows = all.filter((e) => (!cat || e.cat === cat) && (!kw || `${e.title} ${e.body} ${(e.tags || []).join(' ')}`.toLowerCase().includes(kw)))
  if (!rows.length) { list.innerHTML = '<p class="empty">まだ記録がありません。</p>'; return }
  let html = ''
  let month = ''
  for (const e of rows) {
    const mk = monthKey(e.date)
    if (mk !== month) { month = mk; html += `<h2 class="month">${fmtMonth(mk)}</h2>` }
    html += renderEntry(e)
  }
  list.innerHTML = html
}

function stats() {
  const today = todayStr()
  const ym = today.slice(0, 7)
  const inMonth = all.filter((e) => e.date.startsWith(ym))
  const mins = inMonth.filter((e) => CATS[e.cat]?.hours).reduce((s, e) => s + (e.minutes || 0), 0)
  // 連続日数: 今日か昨日から、記録がある日が途切れるまで数える
  const days = new Set(all.map((e) => e.date))
  let streak = 0
  const d = new Date()
  if (!days.has(today)) d.setDate(d.getDate() - 1)
  for (;;) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
    if (!days.has(k)) break
    streak++
    d.setDate(d.getDate() - 1)
  }
  document.getElementById('sMonth').textContent = inMonth.length
  document.getElementById('sHours').textContent = mins ? `${(mins / 60).toFixed(1)}h` : '0h'
  document.getElementById('sStreak').textContent = `${streak}日`
  document.getElementById('sTotal').textContent = all.length
}

filters.addEventListener('click', (ev) => {
  const b = ev.target.closest('button')
  if (!b) return
  cat = b.dataset.cat
  filters.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b))
  render()
})
q.addEventListener('input', render)

try {
  const snap = await getDocs(query(collection(db, 'logs'), where('public', '==', true), orderBy('date', 'desc'), orderBy('createdAt', 'desc'), limit(500)))
  all = snap.docs.map(toEntry)
  stats()
  render()
} catch (e) {
  console.error(e)
  list.innerHTML = `<p class="empty">読み込めませんでした（${esc(e.code || e.message)}）</p>`
}
</script>
<script async src="https://unei-dash.web.app/pv.js" data-site="hikaru-miyashita"></script>
</body>
</html>
